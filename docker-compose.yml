services:
  app:
    build: .
    ports:
      - "${APP_PORT:-4173}:5000"
    environment:
      REID_DEFAULT_MODEL: ${REID_DEFAULT_MODEL:-convnext}
      # Optional: only needed if Kaggle asks for authentication.
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_KEY:-}
    volumes:
      # Test images downloaded from Kaggle are kept between restarts.
      - kaggle-cache:/data/kagglehub
      # Optional local dataset: data/wildlifereid-10k/ or data/archive.zip.
      - ./data:/app/data:ro

volumes:
  kaggle-cache:
